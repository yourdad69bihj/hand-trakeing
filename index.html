<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jordan Elite | Dual Hand Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* The Mod Menu */
        #menu {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 2px solid #00ffff;
            padding: 15px; border-radius: 12px; z-index: 100; text-align: center;
            box-shadow: 0 0 15px #00ffff; width: 300px; color: #00ffff;
        }

        select {
            background: #111; color: #00ffff; border: 1px solid #00ffff;
            padding: 8px; border-radius: 5px; width: 100%; margin-top: 10px;
        }

        /* Full opacity webcam */
        #webcam { 
            transform: rotateY(180deg); 
            position: fixed; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
        }

        /* Overlay for the skeleton and magic */
        #canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            pointer-events: none; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="menu">
        <div id="hint" style="text-transform: uppercase; font-weight: bold;">Dual Tracking Active</div>
        <select id="magicSelect">
            <option value="fire">FIRE (Fist)</option>
            <option value="electric">ELECTRIC (Pinch Index)</option>
            <option value="ice">ICE (Pinch Middle)</option>
            <option value="void">VOID (Flat Palm)</option>
        </select>
    </div>

    <video id="webcam"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const magicSelect = document.getElementById('magicSelect');
        const hint = document.getElementById('hint');

        let particles = [];

        function onResults(results) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks) {
                // MediaPipe handles the 2-hand logic here
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    
                    // 1. DRAW SKELETON (Cyan Bones, Red Joints)
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
                        color: '#00ffff',
                        lineWidth: 5
                    });
                    drawLandmarks(ctx, landmarks, {
                        color: '#ff0000',
                        lineWidth: 1,
                        radius: 4
                    });

                    // 2. DETECT MAGIC
                    const magic = magicSelect.value;
                    const wrist = landmarks[0]; 
                    const x = (1 - wrist.x) * canvas.width;
                    const y = wrist.y * canvas.height;

                    if (magic === 'fire' && checkFist(landmarks)) {
                        spawn(x, y, '#ff4500');
                    } else if (magic === 'electric' && checkPinch(landmarks, 8)) {
                        spawn(x, y, '#00dfff');
                    } else if (magic === 'ice' && checkPinch(landmarks, 12)) {
                        spawn(x, y, '#ffffff');
                    } else if (magic === 'void' && checkFlat(landmarks)) {
                        spawn(x, y, '#8a2be2');
                    }
                });
            }
            updateParticles();
        }

        // Gesture Detection
        function checkFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y; }
        function checkFlat(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y; }
        function checkPinch(lm, idx) {
            return Math.hypot(lm[4].x - lm[idx].x, lm[4].y - lm[idx].y) < 0.04;
        }

        function spawn(x, y, color) {
            for(let i=0; i<5; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random()-0.5)*15,
                    vy: (Math.random()-0.5)*15,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8 * p.life, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        // SETTINGS FOR 2 HANDS
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ 
            maxNumHands: 2, // Changed to 2 hands
            modelComplexity: 1, 
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.7 
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
