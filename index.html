<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Elite | Magic Hand Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #menu {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9); border: 2px solid #00ffff;
            padding: 15px; border-radius: 12px; z-index: 100; text-align: center;
            box-shadow: 0 0 20px #00ffff; width: 300px;
        }

        .label { color: #00ffff; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; margin-bottom: 10px; }
        
        select {
            background: #111; color: #fff; border: 1px solid #00ffff;
            padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; outline: none;
        }

        #webcam { 
            transform: rotateY(180deg); position: fixed; 
            width: 100vw; height: 100vh; object-fit: cover; 
        }

        #canvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 10;
        }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            color: #00ffff; transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loader">
        <h1>JORDAN ELITE</h1>
        <p>INITIALIZING AI TRACKING...</p>
    </div>

    <div id="menu">
        <div class="label">Magic Selection</div>
        <select id="magicSelect">
            <option value="fire">FIRE (Action: Fist)</option>
            <option value="electric">ELECTRIC (Action: Pinch)</option>
            <option value="ice">ICE (Action: Middle Pinch)</option>
            <option value="void">VOID (Action: Flat Palm)</option>
        </select>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const magicSelect = document.getElementById('magicSelect');
        const loader = document.getElementById('loader');

        let particles = [];

        function onResults(results) {
            // Remove loader once tracking starts
            if (loader.style.opacity !== "0") loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 500);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((landmarks) => {
                    
                    // 1. DRAW THE SKELETON HAND
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00ffff', lineWidth: 4});
                    drawLandmarks(ctx, landmarks, {color: '#ff0000', lineWidth: 1, radius: 3});

                    // 2. GESTURE & POSITION LOGIC
                    const magic = magicSelect.value;
                    // Coordinate conversion (mirroring the video)
                    const x = (1 - landmarks[0].x) * canvas.width;
                    const y = landmarks[0].y * canvas.height;

                    if (magic === 'fire' && checkFist(landmarks)) {
                        spawn(x, y, '#ff4500');
                    } else if (magic === 'electric' && checkPinch(landmarks, 8)) {
                        spawn(x, y, '#00dfff');
                    } else if (magic === 'ice' && checkPinch(landmarks, 12)) {
                        spawn(x, y, '#ffffff');
                    } else if (magic === 'void' && checkFlat(landmarks)) {
                        spawn(x, y, '#8a2be2');
                    }
                });
            }
            updateParticles();
        }

        function checkFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y; }
        function checkFlat(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y; }
        function checkPinch(lm, idx) {
            return Math.hypot(lm[4].x - lm[idx].x, lm[4].y - lm[idx].y) < 0.05;
        }

        function spawn(x, y, color) {
            for(let i=0; i<6; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random()-0.5)*15,
                    vy: (Math.random()-0.5)*15,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8 * p.life, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.75, 
            minTrackingConfidence: 0.75 
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
