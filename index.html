<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jordan Elite | Ultimate Magic Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; }
        
        #menu {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.95); border: 2px solid #00ffff;
            padding: 20px; border-radius: 12px; z-index: 100; text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); width: 350px;
        }

        .status-bar { font-size: 0.8em; margin-top: 10px; color: #555; }
        .active-magic { color: #fff; font-size: 1.2em; text-shadow: 0 0 10px #00ffff; }
        
        select {
            background: #111; color: #00ffff; border: 1px solid #00ffff;
            padding: 10px; border-radius: 5px; width: 100%; margin-top: 10px;
            font-family: 'Courier New', monospace;
        }

        #webcam { transform: rotateY(180deg); position: fixed; width: 100vw; height: 100vh; object-fit: cover; opacity: 0.2; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="active-magic" id="hint">SYSTEM READY</div>
        <select id="magicSelect">
            <option value="fire">FIRE (Fist)</option>
            <option value="electric">ELECTRIC (Pinch Index)</option>
            <option value="ice">ICE (Pinch Middle)</option>
            <option value="earth">EARTH (Pinch Pinky)</option>
            <option value="void">VOID (Flat Palm)</option>
        </select>
        <div class="status-bar">Tracking: <span id="track-stat">Searching...</span></div>
    </div>

    <video id="webcam"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const magicSelect = document.getElementById('magicSelect');
        const hint = document.getElementById('hint');
        const trackStat = document.getElementById('track-stat');

        let particles = [];

        function onResults(results) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                trackStat.innerText = "LOCKED";
                trackStat.style.color = "#00ff00";

                for (const landmarks of results.multiHandLandmarks) {
                    // --- DRAW THE TRACKING LINES (The Skeleton) ---
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00ffff', lineWidth: 2});
                    drawLandmarks(ctx, landmarks, {color: '#ff0000', lineWidth: 1, radius: 3});

                    const selectedMagic = magicSelect.value;
                    const palmX = (1 - landmarks[0].x) * canvas.width;
                    const palmY = landmarks[0].y * canvas.height;

                    // Gesture Checks
                    if (selectedMagic === 'fire' && checkFist(landmarks)) {
                        spawn(palmX, palmY, '#ff4400', 15);
                        hint.innerText = "🔥 INFERNO";
                    } 
                    else if (selectedMagic === 'electric' && checkPinch(landmarks, 8)) {
                        spawn(palmX, palmY, '#00bbff', 10);
                        hint.innerText = "⚡ BOLT";
                    }
                    else if (selectedMagic === 'ice' && checkPinch(landmarks, 12)) {
                        spawn(palmX, palmY, '#ffffff', 8);
                        hint.innerText = "❄️ FROST";
                    }
                    else if (selectedMagic === 'earth' && checkPinch(landmarks, 20)) {
                        spawn(palmX, palmY, '#8b4513', 20);
                        hint.innerText = "⛰️ QUAKE";
                    }
                    else if (selectedMagic === 'void' && checkFlat(landmarks)) {
                        spawn(palmX, palmY, '#aa00ff', 5);
                        hint.innerText = "🔮 ABYSS";
                    } else {
                        hint.innerText = "AWAITING GESTURE...";
                    }
                }
            } else {
                trackStat.innerText = "SEARCHING...";
                trackStat.style.color = "#ff0000";
            }
            ctx.restore();
            updateParticles();
        }

        // Gesture Math
        function checkFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y; }
        function checkFlat(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[20].y < lm[18].y; }
        function checkPinch(lm, fingerIdx) {
            const d = Math.hypot(lm[4].x - lm[fingerIdx].x, lm[4].y - lm[fingerIdx].y);
            return d < 0.04;
        }

        function spawn(x, y, color, size) {
            for(let i=0; i<5; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                    life: 1.0, color, size
                });
            }
        }

        function updateParticles() {
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
