<!DOCTYPE html>
<html>
<head>
    <title>Jordan Elite Hand Magic</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #0b0b0b; overflow: hidden; color: cyan; font-family: sans-serif; }
        #webcam { transform: rotateY(180deg); position: fixed; opacity: 0.3; width: 100%; height: 100%; object-fit: cover; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ui { position: fixed; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border: 1px solid cyan; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="ui">
        <h2>ELITE HAND TRACKER</h2>
        <p>Status: <span id="status">Initializing AI...</span></p>
        <p>Gesture: Pinch fingers to spawn Magic</p>
    </div>
    
    <video id="webcam"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        // Particle system for the effect
        let particles = [];

        function onResults(results) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            status.innerText = "Tracking Active";

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Landmark 4 = Thumb Tip, Landmark 8 = Index Tip
                    const thumb = landmarks[4];
                    const index = landmarks[8];

                    // Convert normalized coordinates to screen pixels
                    const x = (1 - index.x) * canvas.width;
                    const y = index.y * canvas.height;

                    // Calculate distance between thumb and index for PINCH
                    const dx = thumb.x - index.x;
                    const dy = thumb.y - index.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);

                    if (distance < 0.05) { // If fingers are touching
                        spawnParticles(x, y);
                    }
                }
            }
            drawParticles();
        }

        function spawnParticles(x, y) {
            for(let i=0; i<5; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) particles.splice(index, 1);
            });
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
