<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JORDAN ELITE | SKELETON MAGIC</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #webcam { transform: rotateY(180deg); position: fixed; width: 100vw; height: 100vh; object-fit: cover; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #ui { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
              background: rgba(0,0,0,0.8); border: 2px solid #00ffff; padding: 15px; border-radius: 10px; color: #00ffff; }
    </style>
</head>
<body>
    <div id="ui"><b>JORDAN ELITE SKELETON</b><br>Status: Tracking Active</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function onResults(results) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // DRAW NEON SKELETON
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00ffff', lineWidth: 5});
                    drawLandmarks(ctx, landmarks, {color: '#ff0000', lineWidth: 2, radius: 4});
                    
                    // PARTICLE MAGIC (Triggered by Fist)
                    if (landmarks[8].y > landmarks[6].y) { // Simple fist detection
                         ctx.shadowBlur = 20; ctx.shadowColor = "#00ffff";
                         ctx.fillStyle = "#00ffff";
                         ctx.beginPath();
                         ctx.arc((1 - landmarks[0].x) * canvas.width, landmarks[0].y * canvas.height, 30, 0, Math.PI*2);
                         ctx.fill();
                    }
                }
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, // Higher complexity for smoother tracking
            minDetectionConfidence: 0.8, 
            minTrackingConfidence: 0.8 
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
