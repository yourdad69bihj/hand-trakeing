<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jordan Elite | Skeleton Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; }
        
        #menu {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9); border: 2px solid #00ffff;
            padding: 15px; border-radius: 10px; z-index: 100; text-align: center;
            box-shadow: 0 0 20px #00ffff; width: 320px;
        }

        .active-magic { color: #fff; font-size: 1.1em; text-transform: uppercase; margin-bottom: 8px; }
        
        select {
            background: #000; color: #00ffff; border: 1px solid #00ffff;
            padding: 8px; border-radius: 5px; width: 100%; cursor: pointer;
        }

        #webcam { transform: rotateY(180deg); position: fixed; width: 100vw; height: 100vh; object-fit: cover; opacity: 0.3; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="active-magic" id="hint">System Initializing...</div>
        <select id="magicSelect">
            <option value="fire">FIRE (Fist)</option>
            <option value="electric">ELECTRIC (Pinch Index)</option>
            <option value="ice">ICE (Pinch Middle)</option>
            <option value="earth">EARTH (Pinch Pinky)</option>
            <option value="void">VOID (Flat Palm)</option>
        </select>
    </div>

    <video id="webcam"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const magicSelect = document.getElementById('magicSelect');
        const hint = document.getElementById('hint');

        let particles = [];

        function onResults(results) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    
                    // --- THE SKELETON HAND ---
                    // This draws the "bones" (connections between points)
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
                        color: '#00ffff', // Cyan bones
                        lineWidth: 4
                    });
                    
                    // This draws the "joints" (the 21 points)
                    drawLandmarks(ctx, landmarks, {
                        color: '#ff0000', // Red joints
                        lineWidth: 1,
                        radius: 4
                    });

                    // --- MAGIC EFFECTS ---
                    const magic = magicSelect.value;
                    const palm = landmarks[0]; // Wrist/Palm point
                    const x = (1 - palm.x) * canvas.width;
                    const y = palm.y * canvas.height;

                    if (magic === 'fire' && checkFist(landmarks)) {
                        spawnEffect(x, y, '#ff4500', 10);
                        hint.innerText = "🔥 INFERNO ACTIVE";
                    } 
                    else if (magic === 'electric' && checkPinch(landmarks, 8)) {
                        spawnEffect(x, y, '#00dfff', 5);
                        hint.innerText = "⚡ VOLTAGE ACTIVE";
                    }
                    else if (magic === 'ice' && checkPinch(landmarks, 12)) {
                        spawnEffect(x, y, '#ffffff', 8);
                        hint.innerText = "❄️ FROST ACTIVE";
                    }
                    else if (magic === 'earth' && checkPinch(landmarks, 20)) {
                        spawnEffect(x, y, '#8b4513', 15);
                        hint.innerText = "⛰️ TERRA ACTIVE";
                    }
                    else if (magic === 'void' && checkFlat(landmarks)) {
                        spawnEffect(x, y, '#8a2be2', 12);
                        hint.innerText = "🔮 VOID ACTIVE";
                    } else {
                        hint.innerText = "WAITING FOR GESTURE...";
                    }
                }
            } else {
                hint.innerText = "HAND NOT DETECTED";
            }
            updateParticles();
        }

        // Gesture Detection Logic
        function checkFist(lm) { return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y; }
        function checkFlat(lm) { return lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[20].y < lm[18].y; }
        function checkPinch(lm, idx) {
            const d = Math.hypot(lm[4].x - lm[idx].x, lm[4].y - lm[idx].y);
            return d < 0.04; // Sensitivity for touching fingers
        }

        function spawnEffect(x, y, color, speed) {
            for(let i=0; i<6; i++) {
                particles.push({
                    x, y, color, 
                    vx: (Math.random()-0.5)*speed, 
                    vy: (Math.random()-0.5)*speed,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6 * p.life, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
